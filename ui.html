<title>Tidepool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#CFEDEA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one portrait screen. Status on top, the reef as a square sand tray in the middle, shop and tide controls in the thumb zone. */
:root {
  --water: #CFEDEA;
  --water-2: #B4E1DC;
  --sand: #FCF5E8;
  --sand-edge: #E9D7B5;
  --ink: #173248;
  --ink-soft: #557184;
  --coral: #FF6B5E;
  --coral-ink: #FFFFFF;
  --shell: #E39B2D;
  --pearl: #8C7BD8;
  --panel: #FFFFFF;
  --ok: #2E9C6A;
  --bad: #D9473B;
  --glow: rgba(255, 214, 102, .85);
  --rock: #CDBFA6;
  --shadow: 0 2px 0 var(--sand-edge), 0 6px 14px rgba(23, 50, 72, .10);
  --font-display: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --water: #0F2C38; --water-2: #0B2230; --sand: #1B3C4A; --sand-edge: #0E2631;
    --ink: #E8F6F3; --ink-soft: #9DBEC6; --coral: #FF8274; --coral-ink: #1A1012;
    --shell: #F2B85C; --pearl: #B7AAF5; --panel: #163746; --ok: #5ED39C; --bad: #FF7B6E;
    --glow: rgba(255, 214, 102, .55); --shadow: 0 2px 0 var(--sand-edge), 0 6px 14px rgba(0, 0, 0, .3);
    --rock: #2B4752;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --water: #0F2C38; --water-2: #0B2230; --sand: #1B3C4A; --sand-edge: #0E2631;
  --ink: #E8F6F3; --ink-soft: #9DBEC6; --coral: #FF8274; --coral-ink: #1A1012;
  --shell: #F2B85C; --pearl: #B7AAF5; --panel: #163746; --ok: #5ED39C; --bad: #FF7B6E;
  --glow: rgba(255, 214, 102, .55); --shadow: 0 2px 0 var(--sand-edge), 0 6px 14px rgba(0, 0, 0, .3);
  --rock: #2B4752;
  color-scheme: dark;
}

/* Forest theme: leaf-litter browns; the background follows the season. Seeds and amber take the shell and pearl colors. */
:root[data-eco="forest"] { --water: #E9EBD6; --water-2: #D9E0C2; --sand: #FBF7EC; --sand-edge: #DCCDAA; --shell: #A86B2D; --pearl: #D98C10; --coral: #D9603B; --rock: #B9A27C; --flower: #C2569B; }
:root[data-eco="forest"][data-season="fall"] { --water: #F2E4C7; --water-2: #E9CF9F; }
:root[data-eco="forest"][data-season="winter"] { --water: #E7EEF1; --water-2: #D2DFE5; }
:root[data-eco="forest"][data-season="spring"] { --water: #E4F0D8; --water-2: #CDE4B9; }
:root[data-eco="forest"][data-season="summer"] { --water: #D7E8C6; --water-2: #BCD8A4; }
@media (prefers-color-scheme: dark) {
  :root[data-eco="forest"]:not([data-theme="light"]) { --water: #1D2A1E; --water-2: #172319; --sand: #2C3A2B; --sand-edge: #172318; --shell: #DDA663; --pearl: #F2B640; --panel: #253427; --rock: #4B4434; --flower: #E58BC6; }
  :root[data-eco="forest"][data-season="fall"]:not([data-theme="light"]) { --water: #2B2518; --water-2: #231E12; }
  :root[data-eco="forest"][data-season="winter"]:not([data-theme="light"]) { --water: #1B2830; --water-2: #152027; }
  :root[data-eco="forest"][data-season="spring"]:not([data-theme="light"]) { --water: #1E2D20; --water-2: #172419; }
  :root[data-eco="forest"][data-season="summer"]:not([data-theme="light"]) { --water: #1A2D1B; --water-2: #132314; }
}
:root[data-eco="forest"][data-theme="dark"] { --water: #1D2A1E; --water-2: #172319; --sand: #2C3A2B; --sand-edge: #172318; --shell: #DDA663; --pearl: #F2B640; --panel: #253427; --rock: #4B4434; --flower: #E58BC6; }

/* Serengeti theme: golden grass; the background turns green in Wet turns and straw in Dry ones. */
:root[data-eco="serengeti"] { --water: #F1E6C4; --water-2: #E6D39A; --sand: #FCF6E6; --sand-edge: #DFCB98; --shell: #A86B2D; --pearl: #D98C10; --coral: #D9603B; --rock: #B7A58A; --flower: #C98A2E; }
:root[data-eco="serengeti"][data-season="wet"] { --water: #E2EDCF; --water-2: #C9DEAE; }
:root[data-eco="serengeti"][data-season="dry"] { --water: #F3E3BC; --water-2: #E8CC8E; }
@media (prefers-color-scheme: dark) {
  :root[data-eco="serengeti"]:not([data-theme="light"]) { --water: #2A2618; --water-2: #221E12; --sand: #3A3524; --sand-edge: #1F1B10; --shell: #DDA663; --pearl: #F2B640; --panel: #332E1F; --rock: #4E4636; --flower: #E3B060; }
  :root[data-eco="serengeti"][data-season="wet"]:not([data-theme="light"]) { --water: #1F2A1A; --water-2: #182214; }
  :root[data-eco="serengeti"][data-season="dry"]:not([data-theme="light"]) { --water: #2E2615; --water-2: #251E10; }
}
:root[data-eco="serengeti"][data-theme="dark"] { --water: #2A2618; --water-2: #221E12; --sand: #3A3524; --sand-edge: #1F1B10; --shell: #DDA663; --pearl: #F2B640; --panel: #332E1F; --rock: #4E4636; --flower: #E3B060; }

html, body { height: 100%; }
body {
  background:
    radial-gradient(120% 60% at 20% 0%, var(--water-2), transparent 60%),
    radial-gradient(90% 50% at 100% 100%, var(--water-2), transparent 70%),
    var(--water);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, .cell:focus-visible, .card:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }

.app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 12px;
  box-sizing: border-box;
}

/* Top status */
.top { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .2px; white-space: nowrap; }
.brand small { font-size: 13px; color: var(--ink-soft); margin-left: 2px; }
/* The year strip (ecosystems with a calendar): one segment per month, colored by season. */
.year { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }
.year:empty { display: none; }
.year span { position: relative; height: 16px; border-radius: 5px; font-size: 9px; font-weight: 700; line-height: 16px; text-align: center; color: var(--ink-soft); background: var(--panel); opacity: .75; }
.year .fall { background: color-mix(in srgb, #E08A2E 30%, var(--panel)); }
.year .winter { background: color-mix(in srgb, #7FA7C9 30%, var(--panel)); }
.year .spring { background: color-mix(in srgb, #E58BC6 28%, var(--panel)); }
.year .summer { background: color-mix(in srgb, #5FAE5A 30%, var(--panel)); }
.year .wet { background: color-mix(in srgb, #5FAE5A 32%, var(--panel)); }
.year .dry { background: color-mix(in srgb, #E0A63A 32%, var(--panel)); }
.year .now { opacity: 1; color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.year .past { opacity: .4; }
.year .goal::after, .year .storm::after { position: absolute; top: -7px; right: -2px; font-size: 9px; }
.year .goal::after { content: '★'; color: var(--coral); }
.year .storm::after { content: '!'; color: var(--bad); }
.tide-pill { font-family: var(--font-display); font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--panel); color: var(--ink-soft); box-shadow: var(--shadow); white-space: nowrap; }
.spacer { flex: 1; }
.counter { display: flex; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; min-width: 52px; justify-content: flex-end; }
.counter svg { width: 22px; height: 22px; flex: none; }
.counter.bump { animation: bump .22s ease-out; }
@keyframes bump { 50% { transform: scale(1.22); } }
.icon-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow); font-family: var(--font-display); font-weight: 700; color: var(--ink-soft); flex: none; }

.goal { display: grid; gap: 5px; }
.goal-text { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); }
.goal-text b { color: var(--ink); font-weight: 700; }
.bar { height: 8px; border-radius: 99px; background: var(--panel); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.08); }
.bar i { display: block; height: 100%; width: 0; background: var(--pearl); border-radius: 99px; transition: width .25s ease-out; }
.bar.met i { background: var(--ok); }

/* Reef */
.reef-wrap { flex: 1; min-height: 0; display: grid; place-items: start center; container-type: size; }
.reef {
  position: relative;
  width: min(100cqw, 100cqh);
  aspect-ratio: 1;
  max-width: 100%;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(0, 1fr));
  gap: 7px;
  padding: 9px;
  box-sizing: border-box;
  border-radius: 22px;
  background: var(--sand-edge);
  box-shadow: 0 10px 24px rgba(23, 50, 72, .14);
}
.cell {
  position: relative;
  border-radius: 14px;
  background: var(--sand);
  display: grid;
  place-items: center;
  min-height: 0;
  overflow: hidden;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.05);
  transition: transform .12s, box-shadow .12s, opacity .12s;
}
svg.art { width: 1.2em; height: 1.2em; display: inline-block; vertical-align: -.25em; overflow: visible; }
.cell .emo { font-size: clamp(26px, 9.5vw, 44px); line-height: 1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.12)); }
.cell .emo svg.art { display: block; }
.cell .lvl { position: absolute; top: 4px; left: 6px; font-size: 11px; font-weight: 700; color: var(--shell); letter-spacing: -1px; }
.cell .age { position: absolute; bottom: 3px; right: 6px; font-size: 11px; font-weight: 700; color: var(--pearl); font-variant-numeric: tabular-nums; }
.cell .order { position: absolute; top: 3px; right: 6px; font-size: 10px; color: var(--ink-soft); opacity: .45; font-variant-numeric: tabular-nums; }
.cell .delta { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cell .delta svg { width: 10px; height: 10px; vertical-align: -1px; margin-left: 1px; }
.cell .delta { display: flex; justify-content: center; gap: 4px; }
.cell .delta .p { color: var(--pearl); }
.cell .delta .s { color: var(--shell); }
.cell .delta .z { color: var(--ink-soft); opacity: .7; }
.cell .lvlup { position: absolute; top: 3px; right: 5px; font-size: 11px; font-weight: 700; color: var(--panel); background: var(--coral); border-radius: 99px; padding: 1px 5px; }
/* Placing: every spot you could use shows its price; spots you can't afford yet stay visible but dimmed. */
.cell .spot-cost { position: absolute; top: 3px; left: 5px; display: flex; align-items: center; gap: 1px; font-size: 11px; font-weight: 700; color: var(--shell); font-variant-numeric: tabular-nums; }
.cell .spot-cost svg { width: 11px; height: 11px; }
.cell.cant { opacity: .5; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ink-soft) 55%, transparent); }
.cell.cant .spot-cost { color: var(--bad); }
.cell.cant .lvlup { background: var(--ink-soft); }
.cell.rock { background: repeating-linear-gradient(135deg, var(--rock) 0 8px, color-mix(in srgb, var(--rock) 85%, var(--sand)) 8px 16px); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--rock) 70%, var(--ink-soft)); }
.cell.rock .price.poor { color: var(--ink-soft); opacity: .7; }
.cell .open { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; color: var(--ink-soft); }
.cell.rock .emo { font-size: clamp(22px, 8vw, 36px); opacity: .85; }
.cell .price { position: absolute; bottom: 4px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--pearl); }
.cell .price svg { width: 11px; height: 11px; }
.cell .yield { position: absolute; bottom: 3px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; opacity: .9; }
.cell .yield svg { width: 9px; height: 9px; vertical-align: -1px; margin-left: 1px; }
.cell .yield .p { color: var(--pearl); }
.cell .yield .s { color: var(--shell); }
.cell.reads { box-shadow: inset 0 0 0 3px var(--ok); }
.cell.boosts { box-shadow: inset 0 0 0 3px var(--coral); }
.cell.usedby { box-shadow: inset 0 0 0 3px var(--pearl); }
.cell .tag { position: absolute; top: 3px; right: 5px; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 99px; color: var(--panel); }
.cell.reads .tag { background: var(--ok); }
.cell.boosts .tag { background: var(--coral); }
.cell.usedby .tag { background: var(--pearl); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; margin-top: 3px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.charms { display: flex; align-items: center; gap: 6px; min-height: 26px; }
.charms:empty, .charms.empty { display: none; }
.charms .owned { display: flex; gap: 4px; }
.charms .owned button { width: 26px; height: 26px; border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); font-size: 15px; line-height: 26px; }
.charms .market { font-family: var(--font-display); font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--pearl); color: var(--panel); animation: glowPulse 1.6s ease-in-out infinite; }
@keyframes glowPulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--pearl) 35%, transparent); } }
.charm-list { display: grid; gap: 8px; }
.charm { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--sand); text-align: left; }
.charm .e { font-size: 26px; }
.charm b { font-family: var(--font-display); font-weight: 600; font-size: 16px; display: block; }
.charm span { font-size: 13px; color: var(--ink-soft); line-height: 1.35; }
.charm .pr { display: flex; align-items: center; gap: 3px; font-weight: 700; color: var(--pearl); font-size: 15px; }
.charm .pr svg { width: 15px; height: 15px; }
.charm:disabled { opacity: .5; }
.cell.valid { box-shadow: inset 0 0 0 2px var(--coral), inset 0 -3px 0 rgba(0,0,0,.05); }
.cell.best { box-shadow: inset 0 0 0 3px var(--coral), 0 0 0 3px var(--glow); }
.cell.invalid { opacity: .45; }
.cell.picked { box-shadow: inset 0 0 0 3px var(--ink-soft); }
.cell.threat { outline: 2px dashed var(--bad); outline-offset: -4px; }
.cell .threat-mark { position: absolute; top: 2px; left: 4px; font-size: 12px; }
.charms .forecast { font-family: var(--font-display); font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.forecast-big { font-size: 48px; text-align: center; }
.cell.k-plant, .cell.k-tree, .cell.k-flora { background: color-mix(in srgb, var(--ok) 20%, var(--sand)); }
.cell.k-understory { background: color-mix(in srgb, var(--flower, var(--coral)) 16%, var(--sand)); }
.card.k-tree { background: color-mix(in srgb, var(--ok) 20%, var(--panel)); }
.card.k-understory { background: color-mix(in srgb, var(--flower, var(--coral)) 16%, var(--panel)); }
.tile-head .big.k-tree { background: color-mix(in srgb, var(--ok) 20%, var(--sand)); }
.tile-head .big.k-understory { background: color-mix(in srgb, var(--flower, var(--coral)) 16%, var(--sand)); }
.kind.tree { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.kind.understory { color: var(--flower, var(--coral)); background: color-mix(in srgb, var(--flower, var(--coral)) 14%, transparent); }
/* Serengeti flora: Lush ones are bright green with a green tag; Grazed ones are straw-colored stubble,
   faded and dashed, with a brown tag, until something turns them Lush again. */
.cell.ts-lush { background: color-mix(in srgb, #4FAE4A 34%, var(--sand)); box-shadow: inset 0 0 0 2px color-mix(in srgb, #3E9A3A 55%, transparent), inset 0 -3px 0 rgba(0,0,0,.05); }
.cell.ts-grazed { background:
    repeating-linear-gradient(100deg, transparent 0 7px, color-mix(in srgb, #9A7430 35%, transparent) 7px 9px) bottom / 100% 26% no-repeat,
    color-mix(in srgb, #D9B060 42%, var(--sand));
  box-shadow: inset 0 0 0 2px transparent; outline: 2px dashed color-mix(in srgb, #9A7430 70%, transparent); outline-offset: -4px; }
.cell.ts-grazed .emo { filter: grayscale(.85) sepia(.5) brightness(.95); opacity: .6; transform: scale(.82) translateY(4px); }
.cell .tstate { position: absolute; top: 4px; right: 5px; font-size: 9px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; padding: 1px 5px; border-radius: 99px; line-height: 13px; }
.cell .tstate.lush { background: #3E9A3A; color: #fff; }
.cell .tstate.grazed { background: #8A6424; color: #FFF3D6; }

/* Seasons: the board tray, its glow and the round pill take the season's color (--season), and Wet and
   Winter add a faint rain or snow texture. Colors match the year strip. */
:root[data-season="fall"] { --season: #E08A2E; }
:root[data-season="winter"] { --season: #7FA7C9; }
:root[data-season="spring"] { --season: #E58BC6; }
:root[data-season="summer"] { --season: #5FAE5A; }
:root[data-season="wet"] { --season: #4C9FC4; }
:root[data-season="dry"] { --season: #E0A63A; }
:root[data-season] .reef { background: color-mix(in srgb, var(--season) 32%, var(--sand-edge)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--season) 35%, transparent), 0 10px 26px color-mix(in srgb, var(--season) 30%, transparent); transition: background .6s, box-shadow .6s; }
:root[data-season="wet"] .reef { background: repeating-linear-gradient(110deg, transparent 0 11px, rgba(255,255,255,.16) 11px 13px), color-mix(in srgb, var(--season) 32%, var(--sand-edge)); }
:root[data-season="winter"] .reef { background: radial-gradient(circle, rgba(255,255,255,.35) 1.2px, transparent 1.6px) 0 0 / 14px 14px, color-mix(in srgb, var(--season) 32%, var(--sand-edge)); }
:root[data-season] .tide-pill { background: color-mix(in srgb, var(--season) 26%, var(--panel)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--season) 55%, transparent); }
/* A banner over the board when the season turns. */
.season-banner { position: absolute; left: 50%; top: 50%; z-index: 5; transform: translate(-50%, -50%); padding: 10px 18px; border-radius: 99px; white-space: nowrap;
  font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--ink); background: color-mix(in srgb, var(--season) 35%, var(--panel));
  box-shadow: 0 0 0 3px var(--season), 0 8px 20px rgba(0,0,0,.18); pointer-events: none; animation: banner 1.9s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.9); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%); } }
/* Forest board states: resting tiles, leaves on tiles and empty spots, tiles in season. */
.cell.dormant .emo { opacity: .5; filter: grayscale(.6); }
.cell .litter { position: absolute; bottom: 3px; right: 4px; font-size: 9px; letter-spacing: -3px; }
.cell .leafpile { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 14px; letter-spacing: -4px; }
.cell.peak .emo { filter: drop-shadow(0 0 6px var(--glow)); }
.card .peak { font-size: 11px; }
.card.inpeak { box-shadow: 0 0 0 2px var(--glow), var(--shadow); }
/* Ecosystem picker */
.eco-list { display: grid; gap: 10px; }
.eco-card { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: var(--sand); text-align: left; }
.eco-card .big { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 34px; background: var(--panel); }
.eco-card b { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.eco-card .meta { display: block; font-size: 12px; color: var(--ink-soft); }
.eco-card .blurb { display: block; font-size: 13px; color: var(--ink); line-height: 1.35; margin-top: 3px; }
.eco-card .best { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--ink-soft); }

<script>
/*ENGINE*/
</script>
<script>
(() => {
  // Every ecosystem runs on its own engine (window.Tidepool.forEco). useEco swaps the rules, words, icons and theme.
  const TPX = window.Tidepool;
  let TP, CONFIG, TILES, CHARMS, KINDS, EVENTS, ECO, T, WORDS, ICON;
  const kindChip = (tag) => `<span class="kind ${tag}">${KINDS[tag].name}</span>`;
  const $ = (id) => document.getElementById(id);
  // Saves are kept per ecosystem. The reef keeps its original keys, so runs saved before ecosystems still load.
  const keyFor = (eco, k) => 'tidepool.' + (eco === 'reef' ? '' : eco + '.') + k;
  const raw = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const store = { get: (k) => raw.get(keyFor(ECO.id, k)), set: (k, v) => raw.set(keyFor(ECO.id, k), v) };
  // Sea ecosystems pay in shells and pearls, land ones in seeds and amber. Code keeps the roles 'shell' and 'pearl'.
  const REALM = {
    sea: { words: { shell: ['shell', 'shells'], pearl: ['pearl', 'pearls'] }, icon: { shell: 'shell', pearl: 'pearl' } },
    land: { words: { shell: ['seed', 'seeds'], pearl: ['amber', 'amber'] }, icon: { shell: 'seed', pearl: 'amber' } },
  };
  const unit = (r, n = 2) => WORDS[r][n === 1 ? 0 : 1];
  const w = (n, r) => `${n} ${unit(r, n)}`;
  const Cap = (x) => x[0].toUpperCase() + x.slice(1);
  // "tide 4" on the reef, "February" in the forest.
  const roundName = (t) => CONFIG.calendar ? CONFIG.calendar.names[TP.month(G, t)] : `${T.round} ${t}`;
  const rounds = (n) => `${n} ${T.round}${n === 1 ? '' : 's'}`;
  function useEco(id) {
    TP = TPX.forEco(id);
    ({ CONFIG, TILES, CHARMS, KINDS, EVENTS } = TP);
    ECO = TP.eco; T = ECO.terms;
    ({ words: WORDS, icon: ICON } = REALM[ECO.realm]);
    document.documentElement.dataset.eco = id;
    if (!TP.phased) delete document.documentElement.dataset.season;
    raw.set('tidepool.eco', id);
    document.querySelectorAll('use.ic-shell').forEach(u => u.setAttribute('href', '#i-' + ICON.shell));
    document.querySelectorAll('use.ic-pearl').forEach(u => u.setAttribute('href', '#i-' + ICON.pearl));
    $('shells').setAttribute('aria-label', Cap(unit('shell'))); $('pearls').setAttribute('aria-label', Cap(unit('pearl')));
    $('brandBtn').innerHTML = `${ECO.name}<small>▾</small>`;
    $('goWord').textContent = T.go;
    document.title = `Tidepool · ${ECO.name}`;
  }
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
  const icon = (n) => `<svg><use href="#i-${(ICON && ICON[n]) || n}"/></svg>`;
  const art = (k) => `<svg class="art" aria-hidden="true"><use href="#t-${k}"/></svg>`;
  // A tile's season(s), and whether this month is one of them.
  const peaksOf = (d) => [].concat((TP.phased && d.peak) || []);
  const inPeak = (d) => peaksOf(d).includes(TP.season(G));
  const rockArt = () => ECO.rockArt || (ECO.realm === 'land' ? 'log' : 'rock');
  const peakName = (d) => peaksOf(d).map(p => ECO.seasons[p].emoji + ' ' + ECO.seasons[p].name).join(' and ');
  // An amount with its icon ("3" + shell), and rules text with "+2 pearls" style amounts turned into icons.
  const amt = (n, r) => `<span class="amt ${r[0]}">${n}${icon(r)}</span>`;
  const ROLE = { shell: 'shell', pearl: 'pearl', seed: 'shell', amber: 'pearl' };
  const fx = (txt) => txt.replace(/([+-]?\d+) (shell|pearl|seed|amber)s?\b/g, (_, n, r) => amt(n, ROLE[r]));
  const yieldTxt = (y) => (y.p || y.s) ? [y.p ? amt('+' + y.p, 'pearl') : '', y.s ? amt('+' + y.s, 'shell') : ''].filter(Boolean).join(' ') : '';

  let G, sel = null, undo = [], busy = false, skip = false, dealt = true;

  const todaySeed = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };

  function start(data, quiet) {
    G = (data && data.G) || store.get('run');
    if (!G || !G.grid || !G.rock || G.grid.length !== CONFIG.cols * CONFIG.rows || (G.eco || 'reef') !== ECO.id || G.grid.some(t => t && !TILES[t.kind]) || G.offers.some(k => k && !TILES[k])) G = TP.newGame(Math.floor(Math.random() * 1e9));
    sel = null; undo = []; busy = false;
    buildReef();
    render();
    if (!quiet) prompts();
  }
  // Whatever the run is waiting on when you come back to it.
  function prompts() {
    if (G.over) endRun();
    else if (!store.get('seenHelp')) showHelp();
    else if (eventPending() && !G.forecastSeen) showForecast(true);
    else if (G.charmOffers.length && G.charmSeen !== G.tide) showCharms();
  }

  // ---------- Ecosystem picker: shown when the app opens, and from the name in the corner ----------
  function showPicker() {
    const cards = TPX.list().map(e => {
      const run = raw.get(keyFor(e.id, 'run')), best = raw.get(keyFor(e.id, 'best')) || 0;
      const live = run && !run.over && run.grid && (run.eco || 'reef') === e.id;
      const eng = TPX.forEco(e.id), st = best ? eng.starsFor(best) : 0;
      const rn = live ? (eng.CONFIG.calendar ? eng.CONFIG.calendar.names[eng.month(run)] : `${e.terms.Round} ${run.tide}`) : '';
      const ic = REALM[e.realm].icon.pearl;
      return `<button class="eco-card${e.id === ECO.id ? ' cur' : ''}" data-eco="${e.id}"><span class="big">${art(e.icon)}</span><span>
        <b>${e.name}</b><span class="meta">${e.region} · ${e.kindness}</span><span class="blurb">${e.blurb}</span>
        <span class="best">${best ? `<span>${'★'.repeat(st)}${'☆'.repeat(3 - st)} best ${best}<svg class="art"><use href="#i-${ic}"/></svg></span>` : '<span>Not played yet</span>'}<span class="go">${live ? 'Continue · ' + rn : 'Play'}</span></span>
      </span></button>`;
    }).join('');
    $('overlay').innerHTML = `<div class="sheet-bg" id="ecoBg"><div class="sheet" role="dialog" aria-label="Choose an ecosystem">
      <h2>Tidepool</h2>
      <p>Pick a place to grow. Each one keeps its own run and best score.</p>
      <div class="eco-list">${cards}</div>
    </div></div>`;
    $('overlay').querySelectorAll('.eco-card').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.eco;
      closeOverlay();
      if (id === ECO.id) { prompts(); return; }
      useEco(id); dealt = true; start();
    }));
    $('ecoBg').addEventListener('click', (e) => { if (e.target.id === 'ecoBg') { closeOverlay(); prompts(); } });
  }

  // The run's forecast event is shown from CONFIG.eventRevealTide until it strikes.
  const eventPending = () => !G.over && TP.eventKnown(G) && !G.struck;

  function newRun(seed, daily) {
    G = TP.newGame(seed);
    G.daily = !!daily;
    sel = null; undo = []; dealt = true;
    closeOverlay();
    save(); render();
  }

  const save = () => store.set('run', G);

  // ---------- Forecast: what the board would make next round if frozen ----------
  const yieldOf = (state) => TP.forecast(state);
  const mini = (n, r) => n ? `<span class="${r[0]}">${n > 0 ? '+' : ''}${n}${icon(r)}</span>` : '';

  // ---------- Rendering ----------
  function buildReef() {
    const reef = $('reef'); reef.innerHTML = '';
    for (let i = 0; i < CONFIG.cols * CONFIG.rows; i++) {
      const b = document.createElement('button');
      b.className = 'cell'; b.dataset.i = i;
      b.addEventListener('click', () => onCell(i));
      reef.appendChild(b);
    }
  }

  function render() {
    if (TP.phased) {
      const sn = TP.season(G);
      document.documentElement.dataset.season = sn;
      // "🍂 November" in the forest; "🌧️ Turn 3" where the phases simply alternate (the strip below names them).
      $('tidePill').textContent = G.over ? 'Run over' : `${ECO.seasons[sn].emoji} ${CONFIG.calendar ? roundName(G.tide) : `${T.Round} ${G.tide}`}`;
      $('tidePill').title = ECO.seasons[sn].name;
    } else $('tidePill').textContent = G.over ? 'Run over' : `${T.Round} ${G.tide} of ${CONFIG.tides}`;
    setCounter('shells', G.shells); setCounter('pearls', G.pearls);
    renderGoal(); renderYear(); renderCharms(); renderReef(); renderShop(); renderInfo(); renderActions();
  }

  function setCounter(id, v) { $(id).querySelector('span').textContent = v; }

  // The year strip: one segment per round colored by its phase (month initials in the forest, turn numbers
  // elsewhere), the goals starred and the event round marked.
  function renderYear() {
    const el = $('year');
    if (!TP.phased) { el.innerHTML = ''; return; }
    let html = '';
    for (let t = 1; t <= CONFIG.tides; t++) {
      const ph = TP.season(G, t), cls = [ph, t === G.tide && !G.over ? 'now' : t < G.tide ? 'past' : '',
        CONFIG.checkpoints[t] != null ? 'goal' : '', t === CONFIG.eventTide && TP.eventKnown(G) && !G.struck ? 'storm' : ''].join(' ');
      const name = CONFIG.calendar ? CONFIG.calendar.names[TP.month(G, t)] : `${T.Round} ${t}, ${ECO.seasons[ph].name}`;
      html += `<span class="${cls}" title="${name}">${CONFIG.calendar ? name[0] : t}</span>`;
    }
    el.innerHTML = html;
  }

  function renderGoal() {
    const cp = TP.nextCheckpoint(G);
    const bar = $('goalBar');
    if (cp) {
      $('goalText').innerHTML = `Hold <b>${w(cp.need, 'pearl')}</b> at the end of ${roundName(cp.tide)}`;
      $('goalNum').textContent = `${Math.min(G.pearls, cp.need)} / ${cp.need}`;
      bar.querySelector('i').style.width = Math.min(100, 100 * G.pearls / cp.need) + '%';
      bar.classList.toggle('met', G.pearls >= cp.need);
    } else {
      const next = CONFIG.stars.find(x => G.pearls < x);
      const st = TP.starsFor(G.pearls);
      $('goalText').innerHTML = next ? `Next star at <b>${w(next, 'pearl')}</b>` : '<b>Three stars.</b> Keep going.';
      $('goalNum').textContent = '★'.repeat(st) + '☆'.repeat(3 - st);
      bar.querySelector('i').style.width = Math.min(100, 100 * G.pearls / (next || G.pearls || 1)) + '%';
      bar.classList.toggle('met', !next);
    }
  }

  function renderCharms() {
    const el = $('charms');
    const owned = G.charms.map(id => `<button data-charm="${id}" aria-label="${CHARMS[id].name}">${CHARMS[id].emoji}</button>`).join('');
    const ev = eventPending() ? EVENTS[TP.eventOf(G)] : null;
    const market = G.charmOffers.length && !G.over;
    el.classList.toggle('empty', !owned && !ev && !market);
    el.innerHTML = `<div class="owned">${owned}</div><div class="spacer"></div>` +
      (ev ? `<button class="forecast" id="forecastBtn">${ev.emoji} ${ev.name} after ${roundName(CONFIG.eventTide)}</button>` : '') +
      (market ? `<button class="market" id="marketBtn">${T.bonus}</button>` : '');
    el.querySelectorAll('[data-charm]').forEach(b => b.addEventListener('click', () => showCharmInfo(b.dataset.charm)));
    if ($('marketBtn')) $('marketBtn').addEventListener('click', showCharms);
    if ($('forecastBtn')) $('forecastBtn').addEventListener('click', () => showForecast());
  }

  function renderReef() {
    const offerKind = sel && sel.type === 'offer' ? G.offers[sel.i] : null;
    const kind = offerKind && !TILES[offerKind].mover && !TILES[offerKind].feller ? offerKind : null;
    // Mover steps: pick a spot for it, then the touching tile to move, then where that tile goes.
    // A feller (the Beaver) just needs the tile it takes.
    let moveOk = null;
    if (offerKind && TILES[offerKind].mover) moveOk = new Set(TP.moverSpots(G));
    else if (offerKind && TILES[offerKind].feller) moveOk = new Set(TP.fellTargets(G, offerKind));
    else if (sel && sel.type === 'move' && sel.from == null) moveOk = new Set(TP.moverTargets(G, sel.cell));
    const fc = !busy ? yieldOf(G) : null;
    // Hint overlay for a selected tile: what it counts, what it powers, and who counts it.
    let hint = null;
    if (sel && sel.type === 'cell' && G.grid[sel.i]) {
      const l = TP.links(G, sel.i);
      const usedBy = G.grid.map((t, j) => t && j !== sel.i && TP.links(G, j).reads.includes(sel.i) ? j : -1).filter(j => j >= 0);
      hint = { reads: new Set(l.reads), boosts: new Set(l.boosts), usedBy: new Set(usedBy) };
    }
    let deltas = null, bestCell = -1, costs = null;
    // Previews show what the tile itself adds each tide: both sides are forecast with the price
    // already paid, so shells a Mantis Shrimp would have traded don't show up as lost pearls and phantom shells.
    const paid = (cost) => { const c = TP.clone(G); c.shells -= cost; return yieldOf(c); };
    if (kind && !busy) {
      deltas = {}; costs = {};
      let bestV = -Infinity;
      G.grid.forEach((_, i) => {
        if (!TP.canPlace(G, kind, i)) return;
        costs[i] = TP.placeCost(G, kind, i);
        const base = paid(costs[i]);
        const c = TP.clone(G); c.shells += 999; TP.buy(c, sel.i, i); c.shells -= 999;
        const y = yieldOf(c); const d = { p: y.p - base.p, s: y.s - base.s };
        deltas[i] = d;
        const v = d.p + d.s * 0.5;
        if (costs[i] <= G.shells && v > bestV) { bestV = v; bestCell = i; }
      });
    }
    if (sel && sel.type === 'move' && sel.from != null && !busy) {
      const base = paid(TP.tileCost(G, G.offers[sel.i])); deltas = {};
      let bestV = -Infinity;
      for (const i of TP.moverDests(G, sel.from)) {
        const c = TP.clone(G); c.shells += 999; TP.useMover(c, sel.i, sel.cell, sel.from, i); c.shells -= 999;
        const y = yieldOf(c); const d = { p: y.p - base.p, s: y.s - base.s };
        deltas[i] = d;
        const v = d.p + d.s * 0.5;
        if (v > bestV) { bestV = v; bestCell = i; }
      }
    }
    const threat = new Set(eventPending() ? TP.eventThreat(G) : []);
    [...$('reef').children].forEach((el, i) => {
      const t = G.grid[i];
      const def = t && TILES[t.kind], ts = TP.tileState(G, i);
      let html = '';
      if (G.rock[i]) {
        html += `<span class="open">New spot</span><span class="emo">${art(rockArt())}</span><span class="price${G.pearls < TP.rockCost(G) && G.shells < TP.rockCost(G, 'shell') ? ' poor' : ''}">${TP.rockCost(G)}${icon('pearl')}${CONFIG.rockSeedCosts ? ` ${TP.rockCost(G, 'shell')}${icon('shell')}` : ''}</span>`;
      } else if (t) {
        html += `<span class="emo">${art(t.kind)}</span>`;
        const y = fc && fc.per[i];
        if (!deltas && y && (y.p || y.s)) html += `<span class="yield">${mini(y.p, 'pearl')}${mini(y.s, 'shell')}</span>`;
        if (t.lvl > 1 && !(costs && i in costs)) html += `<span class="lvl">${t.lvl <= 3 ? '★'.repeat(t.lvl) : '★' + t.lvl}</span>`;
        if (def.showAge) html += `<span class="age">${t.age}</span>`;
        if (t.leaves) html += `<span class="litter" title="Leaves">${'🍂'.repeat(t.leaves)}</span>`;
        if (ts) html += `<span class="tstate ${ts.cls}">${ts.label}</span>`;
      } else if (sel && sel.type === 'move' && sel.cell === i) {
        html += `<span class="emo ghost">${art(G.offers[sel.i])}</span>`;
      } else {
        html += `<span class="order">${i + 1}</span>`;
      }
      if (!t && G.leaves && G.leaves[i] && !G.rock[i] && !(hint || costs)) html += `<span class="leafpile" title="Leaves">${'🍂'.repeat(G.leaves[i])}</span>`;
      if (deltas && deltas[i]) {
        const d = deltas[i];
        const part = (n, r) => n ? `<span class="${r[0]}">${n > 0 ? '+' : ''}${n}${icon(r)}</span>` : '';
        const txt = part(d.p, 'pearl') + part(d.s, 'shell') || '<span class="z">+0</span>';
        html += `<span class="delta">${txt}</span>`;
      }
      if (costs && i in costs) {
        html += `<span class="spot-cost">${costs[i]}${icon('shell')}</span>`;
        if (t) html += `<span class="lvlup">★${t.lvl + 1}</span>`;
      }
      const cant = !!costs && i in costs && costs[i] > G.shells;
      if (hint) {
        const tag = hint.boosts.has(i) ? 'powered' : hint.reads.has(i) ? 'feeds' : hint.usedBy.has(i) ? 'fed' : '';
        if (tag) html += `<span class="tag">${tag}</span>`;
      }
      if (threat.has(i)) html += `<span class="threat-mark">${EVENTS[TP.eventOf(G)].emoji}</span>`;
      el.innerHTML = html;
      el.classList.toggle('threat', threat.has(i));
      el.classList.toggle('rock', !!G.rock[i]);
      el.classList.toggle('dormant', !!t && TP.dormant(G, i));
      el.classList.toggle('ts-grazed', !!ts && ts.cls === 'grazed');
      el.classList.toggle('ts-lush', !!ts && ts.cls === 'lush');
      el.classList.toggle('peak', !!t && inPeak(def) && !TP.dormant(G, i));
      el.classList.toggle('reads', !!hint && hint.reads.has(i) && !hint.boosts.has(i));
      el.classList.toggle('boosts', !!hint && hint.boosts.has(i));
      el.classList.toggle('usedby', !!hint && hint.usedBy.has(i) && !hint.reads.has(i) && !hint.boosts.has(i));
      for (const k in KINDS) el.classList.toggle('k-' + k, !!t && def.tag === k);
      const moving = sel && sel.type === 'move' && (sel.from === i || sel.cell === i);
      el.classList.toggle('cant', cant);
      el.classList.toggle('valid', (!!deltas && i in deltas && i !== bestCell && !cant) || (!!moveOk && moveOk.has(i)));
      el.classList.toggle('best', !!deltas && i === bestCell);
      el.classList.toggle('invalid', (!!deltas && !(i in deltas) && !moving) || (!!moveOk && !moveOk.has(i) && !moving));
      el.classList.toggle('picked', (!!sel && (sel.type === 'cell' || sel.type === 'rock') && sel.i === i) || !!moving);
      el.setAttribute('aria-label', (G.rock[i] ? `${T.Rock}, ${T.clear.toLowerCase()} for ${w(TP.rockCost(G), 'pearl')}` : t ? `${def.name}${t.lvl > 1 ? ' level ' + t.lvl : ''}, ${KINDS[def.tag].name.toLowerCase()}` : `Empty spot ${i + 1}`) + (costs && i in costs ? `, costs ${w(costs[i], 'shell')}` : ''));
    });
  }

  function renderShop() {
    const shop = $('shop'); shop.innerHTML = '';
    shop.style.gridTemplateColumns = `repeat(${G.offers.length}, minmax(0, 1fr))`;
    G.offers.forEach((k, i) => {
      const b = document.createElement('button');
      b.className = 'card';
      if (!k) { b.classList.add('sold'); b.disabled = true; shop.appendChild(b); return; }
      const def = TILES[k];
      b.classList.add('k-' + def.tag);
      const cost = TP.tileCost(G, k);
      if (cost > G.shells) b.classList.add('poor');
      if (sel && (sel.type === 'offer' || sel.type === 'move') && sel.i === i) b.classList.add('sel');
      if (dealt) { b.classList.add('new'); b.style.animationDelay = (i * 60) + 'ms'; }
      const twin = G.grid.find(t => t && t.kind === k && t.lvl < TP.maxLevel(k));
      const peak = peaksOf(def).length ? ECO.seasons[peaksOf(def)[0]] : null;
      if (peak && inPeak(def)) b.classList.add('inpeak');
      b.innerHTML = (twin ? `<span class="twin">★${twin.lvl + 1}</span>` : '') + `<span class="rar ${def.rarity}"></span><span class="emo">${art(k)}</span><span class="nm">${def.name}</span><span class="cost">${peak ? `<span class="peak" title="Peaks in ${peak.name.toLowerCase()}">${peak.emoji}</span>` : ''}${icon('shell')}${cost}</span>`;
      b.setAttribute('aria-label', `${def.name}, ${KINDS[def.tag].name.toLowerCase()}, costs ${w(cost, 'shell')}. ${def.text(1)}${twin ? ' Can level up a tile you own.' : ''}`);
      b.addEventListener('click', () => onOffer(i));
      shop.appendChild(b);
    });
    dealt = false;
  }

  function renderInfo() {
    const el = $('info');
    if (sel && sel.type === 'move') {
      const def = TILES[G.offers[sel.i]];
      const step = sel.from == null ? 'Tap the touching tile to move.' : 'Tap where it goes: one space up, down, left or right. A filled spot swaps.';
      el.innerHTML = `<div class="txt"><span class="name">${def.name}</span> ${step}</div><button class="chip" id="moveCancel">Cancel</button>`;
      $('moveCancel').addEventListener('click', () => { sel = null; render(); });
      return;
    }
    if (sel && sel.type === 'offer') {
      const k = G.offers[sel.i], def = TILES[k];
      const cost = TP.tileCost(G, k), poor = cost > G.shells;
      const need = poor ? `<span class="chip">Need ${amt(cost - G.shells, 'shell')} more</span>` : '';
      if (def.feller) {
        const n = TP.fellTargets(G, k).length;
        el.innerHTML = `<div class="txt"><span class="name">${def.name}</span> ${fx(def.text(1))}</div>` + (need || (n ? '' : `<span class="chip">No tree to fell</span>`));
        return;
      }
      if (def.mover) {
        const spots = TP.moverSpots(G).length;
        el.innerHTML = `<div class="txt"><span class="name">${def.name}</span> ${fx(def.text(1))}</div>` +
          (need || (spots ? '' : `<span class="chip">No empty spot beside a tile</span>`));
        return;
      }
      // Only prices of placements that are legal on the board right now: a new spot, and each level-up available.
      const legal = G.grid.map((t, i) => TP.canPlace(G, k, i) ? i : -1).filter(i => i >= 0);
      const lines = [];
      if (legal.some(i => !G.grid[i])) lines.push(`<span class="next">New spot for ${amt(cost, 'shell')}</span>`);
      const seen = new Set();
      for (const i of legal.filter(i => G.grid[i]).sort((x, y) => G.grid[x].lvl - G.grid[y].lvl)) {
        const L = G.grid[i].lvl + 1, c = TP.placeCost(G, k, i), key = L + ':' + c;
        if (seen.has(key)) continue; seen.add(key);
        lines.push(`<span class="next"><span class="star-chip">★${L}</span>for ${amt(c, 'shell')}: ${fx(def.text(L))}</span>`);
      }
      el.innerHTML = `<div class="txt"><span class="name">${def.name}</span> ${fx(def.text(1))}${lines.join('')}</div>` + need;
      return;
    }
    if (G.over) {
      el.innerHTML = `<div class="txt">The run is over.</div><button class="chip" id="overNew">New ${T.board}</button>`;
      $('overNew').addEventListener('click', () => newRun(Math.floor(Math.random() * 1e9)));
      return;
    }
    const open = G.grid.filter((t, i) => !t && !G.rock[i]).length;
    const rocks = G.rock.filter(Boolean).length;
    const tip = rocks && open <= 1 ? `Your ${T.board} is nearly full. Tap a ${T.rock} to ${T.clear.toLowerCase()} it with ${unit('pearl')} and open a new spot.`
      : rocks && G.tide <= 2 ? `The striped ${T.rock}s are locked spots. Later you can ${T.clear.toLowerCase()} them with ${unit('pearl')} to grow your ${T.board}.`
      : CONFIG.calendar && G.tide <= 2 ? 'Every tile keeps its own calendar. Tap one to see what it does in each season, and watch the year strip above.'
      : CONFIG.cycle && G.tide <= 2 ? `Odd ${T.round}s are Wet: the rain turns every flora Lush. Dry ones start with flora Grazed (straw-colored) unless a Waterhole below waters them.`
      : `Tap a tile to see what it does. Tiles fire in order, 1 to 16.`;
    el.innerHTML = `<div class="txt">${tip}</div>`;
  }

  function renderActions() {
    const y = yieldOf(G);
    $('forecast').innerHTML = G.over ? '' : `${T.boardMakes} ${amt(y.p, 'pearl')} ${amt(y.s, 'shell')}`;
    const rc = TP.rerollCost(G);
    $('rerollCost').textContent = rc || 'free';
    $('rerollBtn').disabled = busy || G.over || G.shells < rc;
    $('tideBtn').disabled = busy || G.over;
    $('undoBtn').disabled = busy || !undo.length;
  }

  // ---------- Input ----------
  function onOffer(i) {
    if (busy || G.over) return;
    sel = sel && (sel.type === 'offer' || sel.type === 'move') && sel.i === i ? null : { type: 'offer', i };
    buzz(5); render();
  }

  function onCell(i) {
    if (busy) { skip = true; return; }
    if (G.over) return;
    if (sel && sel.type === 'move') { onMoveCell(i); return; }
    if (sel && sel.type === 'offer') {
      const k = G.offers[sel.i];
      if (TP.tileCost(G, k) > G.shells) { toast(`You need ${w(TP.tileCost(G, k), 'shell')}`); return; }
      if (TILES[k].feller) {
        if (!TP.fellTargets(G, k).includes(i)) { toast(`Tap a tree for the ${TILES[k].name}`); return; }
        undo.push(TP.clone(G));
        const name = TILES[G.grid[i].kind].name;
        if (!TP.useFeller(G, sel.i, i)) { undo.pop(); return; }
        sel = null; buzz([10, 30, 10]); save(); render();
        pulse($('reef').children[i], 'placed');
        floatAt(i, `${art(k)} timber!`, 'm');
        toast(`${name} felled into a ${T.rock}`);
        return;
      }
      if (TILES[k].mover) {
        if (!TP.moverSpots(G).includes(i)) { toast(`Put the ${TILES[k].name} on an empty spot beside a tile`); return; }
        sel = { type: 'move', i: sel.i, cell: i, from: null }; buzz(5); render();
        return;
      }
      if (!TP.canPlace(G, k, i)) { toast(G.grid[i] ? 'Only a twin can stack there' : 'Can’t place there'); return; }
      if (TP.placeCost(G, k, i) > G.shells) { toast(`Leveling up costs ${w(TP.placeCost(G, k, i), 'shell')}`); return; }
      undo.push(TP.clone(G));
      const lvlUp = !!G.grid[i], leafy = !lvlUp && G.leaves && G.leaves[i];
      TP.buy(G, sel.i, i);
      sel = null; buzz(lvlUp ? [10, 40, 18] : 12); save(); render();
      const el = $('reef').children[i];
      el.classList.remove('placed'); void el.offsetWidth; el.classList.add('placed');
      if (lvlUp) floatAt(i, `★${G.grid[i].lvl}`, 'm');
      else if (leafy && G.grid[i].lvl > 1) floatAt(i, `🍂 ★${G.grid[i].lvl}`, 'm');
      else if (leafy && TILES[G.grid[i].kind].tag === 'critter') floatAt(i, `+${CONFIG.leafSeeds * leafy}`, 's');
      return;
    }
    if (G.rock[i]) showRock(i);
    else if (G.grid[i]) showTile(i);
    else if (G.leaves && G.leaves[i]) toast(leafNote(i));
    else if (sel) { sel = null; render(); }
  }

  // ---------- Tile, rock and charm sheets: tap a reef spot for what it does; tap outside to dismiss ----------
  function lowSheet(label, body) {
    $('overlay').innerHTML = `<div class="sheet-bg low" id="lowBg"><div class="sheet" role="dialog" aria-label="${label}">${body}</div></div>`;
    $('lowBg').addEventListener('click', (e) => {
      if (e.target.id !== 'lowBg') return;
      // A tap on another reef spot through the backdrop opens that spot instead.
      const under = document.elementsFromPoint(e.clientX, e.clientY).find(n => n.classList && n.classList.contains('cell'));
      dismiss();
      if (under) onCell(+under.dataset.i);
    });
    $('overlay').querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', dismiss));
  }
  function dismiss() { closeOverlay(); if (sel && sel.type !== 'offer' && sel.type !== 'move') { sel = null; render(); } }
  const head = (emoji, title, sub, cls = '') => `<div class="tile-head"><div class="big ${cls}">${emoji}</div><div><h3>${title}</h3>${sub ? `<div class="sub">${sub}</div>` : ''}</div><button class="x" data-close aria-label="Close">×</button></div>`;

  function showTile(i) {
    sel = { type: 'cell', i }; render();
    const t = G.grid[i], def = TILES[t.kind];
    const y = yieldOf(G).per[i] || { p: 0, s: 0 };
    const l = TP.links(G, i);
    const usedBy = G.grid.some((u, j) => u && j !== i && TP.links(G, j).reads.includes(i));
    const canUp = t.lvl < TP.maxLevel(t.kind);
    const stars = t.lvl > 1 ? ` <span style="color:var(--shell)">★${t.lvl}</span>` : '';
    const legend = [l.reads.length ? '<span><i style="background:var(--ok)"></i>feeds it</span>' : '',
      l.boosts.length ? '<span><i style="background:var(--coral)"></i>powered by it</span>' : '',
      usedBy ? '<span><i style="background:var(--pearl)"></i>fed by it</span>' : ''].join('');
    const plant = ECO.id === 'forest' && def.tag !== 'critter', needL = t.kind === 'ginger' ? 1 : CONFIG.leavesToGrow;
    lowSheet(def.name, head(art(t.kind), def.name + stars, `${kindChip(def.tag)} <span>fires ${ordinal(i + 1)}</span>`, 'k-' + def.tag) +
      `<div class="effect">${fx(def.text(t.lvl))}</div>
      <div class="facts">
        <div><span class="k">Next ${T.round}</span><span class="v">${yieldTxt(y) || (TP.dormant(G, i) ? 'Resting this ' + T.round : 'Nothing yet')}</span></div>
        ${peaksOf(def).length ? `<div><span class="k">${def.helper ? 'On in' : '×2 in'}</span><span class="v">${peakName(def)}${inPeak(def) ? ' (now)' : ''}</span></div>` : ''}
        ${plant && def.tag === 'understory' && canUp ? `<div><span class="k">Leaves</span><span class="v">${t.leaves || 0} of ${needL} to grow to ★${t.lvl + 1}</span></div>` : ''}
        ${TP.tileState(G, i) ? `<div><span class="k">Now</span><span class="v">${TP.tileState(G, i).label}</span></div>` : ''}
        ${def.showAge ? `<div><span class="k">Grown</span><span class="v">${rounds(t.age)}</span></div>` : ''}
        <div><span class="k">Level up</span><span class="v">${canUp ? `<span class="star-chip">★${t.lvl + 1}</span>for ${amt(TP.placeCost(G, t.kind, i), 'shell')}: ${fx(def.text(t.lvl + 1))}` : `Max level (★${t.lvl}).`}</span></div>
      </div>
      ${legend ? `<div class="legend">${legend}</div>` : ''}
      <div class="row"><button class="btn" id="sellBtn">Sell for ${amt(TP.sellValue(t), 'shell')}</button><button class="btn go" data-close>OK</button></div>`);
    $('sellBtn').addEventListener('click', () => {
      undo.push(TP.clone(G));
      TP.sell(G, i); sel = null; buzz(8); closeOverlay(); save(); render();
    });
  }

  function showRock(i) {
    sel = { type: 'rock', i }; render();
    const cost = TP.rockCost(G), seedCost = CONFIG.rockSeedCosts ? TP.rockCost(G, 'shell') : null, cp = TP.nextCheckpoint(G);
    lowSheet(T.Rock, head(art(rockArt()), T.Rock, 'A locked spot') +
      `<div class="effect">${T.clear} it to open a new spot for tiles${seedCost ? `, paying ${w(cost, 'pearl')} or ${w(seedCost, 'shell')}` : ` with ${unit('pearl')}`}. Each one costs more than the last.</div>
      <p>You have ${amt(G.pearls, 'pearl')}${seedCost ? ` and ${amt(G.shells, 'shell')}` : ''}.${cp ? ` Keep ${amt(cp.need, 'pearl')} for the goal at the end of ${roundName(cp.tide)}.` : ''}</p>
      <div class="row">${seedCost ? `<button class="btn" id="breakSeeds" ${G.shells < seedCost ? 'disabled' : ''}>${T.clear} for ${amt(seedCost, 'shell')}</button>` : '<button class="btn" data-close>Not now</button>'}<button class="btn go" id="breakBtn" ${G.pearls < cost ? 'disabled' : ''}>${T.clear} for ${amt(cost, 'pearl')}</button></div>`);
    const clear = (pay) => {
      undo.push(TP.clone(G));
      if (TP.breakRock(G, i, pay)) { sel = null; buzz([10, 30, 10]); closeOverlay(); save(); render(); pulse($('reef').children[i], 'placed'); }
      else undo.pop();
    };
    $('breakBtn').addEventListener('click', () => clear('pearl'));
    if ($('breakSeeds')) $('breakSeeds').addEventListener('click', () => clear('shell'));
  }

  // Leaves on an empty forest spot: what placing a tile there does.
  const leafNote = (i) => `${G.leaves[i]} ${G.leaves[i] === 1 ? 'leaf' : 'leaves'} here. A critter placed here gets ${w(CONFIG.leafSeeds * G.leaves[i], 'shell')}; a plant grows from them.`;

  function showCharmInfo(id) {
    const c = CHARMS[id];
    lowSheet(c.name, head(c.emoji, c.name, `${T.bonusOne}, yours for the run`) + `<div class="effect">${fx(c.text)}</div><div class="row"><button class="btn go" data-close>OK</button></div>`);
  }


  const ordinal = (n) => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');

  // Mover steps after its spot is picked: choose the touching tile, then where it goes.
  function onMoveCell(i) {
    const name = TILES[G.offers[sel.i]].name;
    if (sel.from == null) {
      if (i === sel.cell) { sel = { type: 'offer', i: sel.i }; render(); return; }
      if (!TP.moverTargets(G, sel.cell).includes(i)) { toast(`The ${name} can only move a tile it touches`); return; }
      sel.from = i; buzz(5); render();
      return;
    }
    if (i === sel.from) { sel.from = null; render(); return; }
    if (!TP.moverDests(G, sel.from).includes(i)) { toast('One space up, down, left or right'); return; }
    undo.push(TP.clone(G));
    const { from, cell } = sel, swapped = !!G.grid[i];
    if (!TP.useMover(G, sel.i, cell, from, i)) { undo.pop(); toast('Can’t move there'); return; }
    logPlaytest(G.moves[G.moves.length - 1]);
    sel = null; buzz([10, 30, 10]); save(); render();
    pulse($('reef').children[i], 'placed');
    if (swapped) pulse($('reef').children[from], 'placed');
    floatAt(cell, `${art(G.moves[G.moves.length - 1].mover)} bye!`, 'm');
  }

  // Playtest record: every mover play, kept across runs (the run itself also keeps G.moves).
  function logPlaytest(m) {
    const log = store.get('playlog') || [];
    log.push({ ...m, seed: G.seed, when: new Date().toISOString() });
    store.set('playlog', log.slice(-500));
  }

  $('undoBtn').addEventListener('click', () => {
    if (busy || !undo.length) return;
    G = undo.pop(); sel = null; save(); render();
  });
  $('rerollBtn').addEventListener('click', () => {
    if (busy) return;
    undo.push(TP.clone(G));
    if (TP.reroll(G)) { sel = null; dealt = true; buzz(8); save(); render(); } else undo.pop();
  });
  $('tideBtn').addEventListener('click', runTide);
  $('helpBtn').addEventListener('click', showHelp);
  $('brandBtn').addEventListener('click', () => { if (!busy) showPicker(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('lowBg')) dismiss(); });
  document.addEventListener('pointerdown', () => { if (busy) skip = true; });

  // ---------- The tide: fire the reef with a paced, skippable animation ----------
  const wait = (ms) => new Promise(r => setTimeout(r, skip ? 0 : ms));

  function floatAt(i, text, cls, offsetY = 0) {
    const reef = $('reef'), cell = reef.children[i];
    const f = document.createElement('div');
    f.className = 'float ' + cls; f.innerHTML = text;
    f.style.left = (cell.offsetLeft + cell.offsetWidth / 2) + 'px';
    f.style.top = (cell.offsetTop + cell.offsetHeight / 2 + offsetY) + 'px';
    reef.appendChild(f);
    setTimeout(() => f.remove(), 850);
  }

  function pulse(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  async function runTide() {
    if (busy || G.over) return;
    busy = true; skip = false; sel = null; undo = [];
    render();
    const startS = G.shells, startP = G.pearls;
    const before = TP.clone(G);
    const events = TP.runTide(G);
    const cells = $('reef').children;
    // Show counters climbing from the pre-tide values.
    setCounter('shells', startS); setCounter('pearls', startP);
    let step = 0;
    for (const e of events) {
      const d = Math.max(110, 300 - step * 12); step++;
      const el = cells[e.cell];
      if (e.type === 'echo') {
        pulse(el, 'echoing');
        for (const j of e.targets) pulse(cells[j], 'echoing');
        floatAt(e.cell, 'echo', 'm');
        if (e.p) floatAt(e.cell, `+${e.p}`, 'p', 14);
        buzz(6);
        await wait(d * 0.8);
        continue;
      }
      pulse(el, 'fire');
      if (e.mult > 1) floatAt(e.cell, `×${e.mult}`, 'm', -22);
      if (e.p) floatAt(e.cell, `${e.p > 0 ? '+' : ''}${e.p}`, 'p', e.s ? -8 : 0);
      if (e.s) floatAt(e.cell, `${e.s > 0 ? '+' : ''}${e.s}`, 's', e.p ? 14 : 0);
      if (TILES[e.kind].cheer && !e.idle) floatAt(e.cell, TILES[e.kind].cheer, 'm');
      setCounter('shells', e.shells); setCounter('pearls', e.pearls);
      if (e.p) pulse($('pearls'), 'bump');
      if (e.s) pulse($('shells'), 'bump');
      if (e.p || e.s) buzz(e.p >= 10 ? 14 : 7);
      await wait(d);
    }
    await wait(250);
    setCounter('shells', G.shells); pulse($('shells'), 'bump');
    busy = false; skip = false; dealt = true;
    save();
    render();
    const earned = G.lastTide.earned;
    // The season turned: say so over the board ("🌧️ Wet season", "🍂 Fall").
    if (TP.phased && !G.over && TP.season(G) !== TP.season(before)) {
      const sn = ECO.seasons[TP.season(G)], b = document.createElement('div');
      b.className = 'season-banner'; b.textContent = `${sn.emoji} ${sn.name}${CONFIG.calendar ? '' : ' season'}`;
      $('reef').appendChild(b); setTimeout(() => b.remove(), 2000);
    }
    if (G.grew && G.grew.tide === before.tide) G.grew.cells.forEach(j => G.grid[j] && floatAt(j, `🍂 ★${G.grid[j].lvl}`, 'm'));
    if (G.over) { endRun(before); return; }
    const passed = Object.keys(CONFIG.checkpoints).map(Number).find(t => t === before.tide);
    toast(passed ? `Goal reached! +${w(earned, 'pearl')} this ${T.round}` : `+${w(earned, 'pearl')} · ${T.incomeWord} ${w(G.lastTide.income, 'shell')}`);
    const struck = G.lastTide.struck;
    if (struck) setTimeout(() => showStrike(struck), 700);
    else if (eventPending() && !G.forecastSeen) setTimeout(() => showForecast(true), 700);
    else if (G.charmOffers.length) setTimeout(showCharms, 700);
  }

  // Forecast sheet: first shown when the event is revealed, then from the forecast chip. Leads into the charm market.
  function showForecast(first) {
    const ev = EVENTS[TP.eventOf(G)];
    G.forecastSeen = true; save();
    const left = CONFIG.eventTide - G.tide + 1;
    const extra = ev.moves ? 'Plan for the new neighbors.' : ev.threat ? `Tiles it would ${ev.spares ? 'hit' : 'take'} right now have a dashed red outline.` : '';
    $('overlay').innerHTML = `<div class="sheet-bg" id="fcBg"><div class="sheet" role="dialog" aria-label="Forecast">
      <h2>${first ? 'Forecast' : ev.name}</h2>
      <div class="forecast-big">${ev.emoji}</div>
      <p><b>${ev.name}.</b> ${ev.text()}</p>
      <p>${Cap(rounds(left))} to get ready. ${extra}</p>
      <div class="row"><button class="btn go" id="fcClose">Got it</button></div>
    </div></div>`;
    const done = () => { closeOverlay(); if (first && G.charmOffers.length && G.charmSeen !== G.tide) showCharms(); };
    $('fcClose').addEventListener('click', done);
    $('fcBg').addEventListener('click', (e) => { if (e.target.id === 'fcBg') done(); });
  }

  function showStrike(st) {
    const ev = EVENTS[st.event];
    const lost = st.lost.map(l => `${art(l.kind)} ${TILES[l.kind].name}${l.lvl > 1 ? ' ★' + l.lvl : ''}`).join(', ');
    const what = st.note ? st.note : ev.moves ? 'Every tile shifted one space left and one row down.'
      : ev.spares ? ev.text()
      : lost ? `Lost: ${lost}.` : `Your ${T.board} held. Nothing was lost.`;
    buzz([30, 60, 30]);
    $('overlay').innerHTML = `<div class="sheet-bg" id="stBg"><div class="sheet" role="dialog" aria-label="${ev.name}">
      <h2>${ev.name}!</h2>
      <div class="forecast-big">${ev.emoji}</div>
      <p>${what} ${Cap(rounds(CONFIG.tides - CONFIG.eventTide))} left${ev.spares ? '' : ' to rebuild'}.</p>
      <div class="row"><button class="btn go" id="stClose">${ev.spares ? 'OK' : 'Rebuild'}</button></div>
    </div></div>`;
    $('stClose').addEventListener('click', closeOverlay);
    $('stBg').addEventListener('click', (e) => { if (e.target.id === 'stBg') closeOverlay(); });
  }

  // ---------- Overlays ----------
  function closeOverlay() { $('overlay').innerHTML = ''; }

  function toast(msg) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2300);
  }

  function endRun(before) {
    const best = store.get('best') || 0;
    const isBest = G.won && G.pearls > best;
    if (isBest) store.set('best', G.pearls);
    const st = G.won ? TP.starsFor(G.pearls) : 0;
    buzz(G.won ? [20, 60, 20, 60, 40] : [40]);
    const title = G.won ? (st === 3 ? `A legendary ${T.board}` : st === 2 ? `A lively ${T.board}` : st === 1 ? `A cozy ${T.board}` : T.zeroStar) : `Missed the goal at the end of ${roundName(G.failedAt)}`;
    const need = CONFIG.checkpoints[G.failedAt];
    $('overlay').innerHTML = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-label="Run summary">
      <h2>${title}</h2>
      <div class="big-score">${icon('pearl')}${G.pearls}</div>
      ${G.won ? `<div class="stars">${[0, 1, 2].map(n => `<span class="${n < st ? '' : 'off'}">★</span>`).join('')}</div>` : `<p>You needed to hold ${w(need, 'pearl')} at the end of ${roundName(G.failedAt)}. ${T.failHint}</p>`}
      ${G.moves && G.moves.length ? `<p>Moves made with a ${TILES[G.moves[0].mover].name} this run: ${G.moves.length}.</p>` : ''}
      <p>${isBest ? `New best ${T.board}!` : `Best ${T.board}: ${w(Math.max(best, 0), 'pearl')}.`} ${G.daily ? `Daily ${T.board} for today.` : ''}</p>
      <div class="row"><button class="btn" id="dailyBtn">Daily ${T.board}</button><button class="btn go" id="againBtn">New ${T.board}</button></div>
      <div class="row"><button class="btn" id="ecoBtn">Ecosystems</button></div>
    </div></div>`;
    $('againBtn').addEventListener('click', () => newRun(Math.floor(Math.random() * 1e9)));
    $('dailyBtn').addEventListener('click', () => newRun(todaySeed(), true));
    $('ecoBtn').addEventListener('click', showPicker);
  }

  function showCharms() {
    if (!G.charmOffers.length || G.over) return;
    G.charmSeen = G.tide; save();
    const rows = G.charmOffers.map(id => {
      const c = CHARMS[id], price = TP.charmPrice(G, id);
      return `<button class="charm" data-id="${id}" ${G.pearls < price ? 'disabled' : ''}><span class="e">${c.emoji}</span><span><b>${c.name}</b>${fx(c.text)}</span><span class="pr">${price}${icon('pearl')}</span></button>`;
    }).join('');
    const cp = TP.nextCheckpoint(G);
    $('overlay').innerHTML = `<div class="sheet-bg" id="charmBg"><div class="sheet" role="dialog" aria-label="${T.bonus}">
      <h2>${T.bonus}</h2>
      <p>Spend ${unit('pearl')} on one, and it's yours for the rest of the run. You have ${w(G.pearls, 'pearl')}${cp ? `, and need to hold ${cp.need} at the end of ${roundName(cp.tide)}` : ''}.</p>
      <div class="charm-list">${rows}</div>
      <div class="row"><button class="btn" id="charmSkip">Not now</button></div>
    </div></div>`;
    $('overlay').querySelectorAll('.charm').forEach(b => b.addEventListener('click', () => {
      undo.push(TP.clone(G));
      if (TP.buyCharm(G, b.dataset.id)) { closeOverlay(); buzz([10, 40, 10, 40, 20]); save(); dealt = true; render(); toast(`${CHARMS[b.dataset.id].name} is yours`); }
      else undo.pop();
    }));
    $('charmSkip').addEventListener('click', closeOverlay);
    $('charmBg').addEventListener('click', (e) => { if (e.target.id === 'charmBg') closeOverlay(); });
  }

  function helpText() {
    const M = (t) => CONFIG.calendar.names[TP.month(G, t)];
    if (ECO.id === 'serengeti') return `
      <h2>${T.title}</h2>
      <ol>
        <li>Buy tiles with seeds and place them on the savanna. Drop a tile on its twin to level it up: ★2 makes double, ★3 triple. Zebra and Red Oat Grass stack without limit.</li>
        <li><b>Seasons.</b> Turns alternate: odd turns are 🌧️ Wet, even turns ☀️ Dry. Each Wet turn starts with rain that turns every flora Lush, and ends with ${w(CONFIG.phaseIncome.wet, 'shell')}. Each Dry turn starts with every flora Grazed except the ones a Waterhole waters (the three cells above it), and ends with only ${w(CONFIG.phaseIncome.dry, 'shell')}. Some tiles do different things in each.</li>
        <li><b>Grazing.</b> Gazelles and Wildebeest graze touching Lush flora for amber, leaving it Grazed (straw-colored, with a brown GRAZED tag; Lush flora are green with a LUSH tag). Grazed flora still fire as normal, but can't be grazed again until something turns them Lush: the next rain, a Waterhole at the end of the turn (the three cells above it), a Dung Beetle, or an Elephant. Star Grass pays extra amber when it's grazed. Tiles fire in order 1 to 16, so put grazers after the tiles that want Lush flora.</li>
        <li>Amber is your score and your money. Spend it on Treasures (offered at turns ${CONFIG.charmTides.join(', ')}) and to clear kopjes for more space, but hold enough to meet the goals at turns ${Object.keys(CONFIG.checkpoints).join(' and ')} (both Dry).</li>
        <li>At turn ${CONFIG.eventRevealTide} you learn the forecast: an Endless Drought, Brushfire or Great Migration after turn ${CONFIG.eventTide}.</li>
        <li>Your score is the amber you hold after turn ${CONFIG.tides}.</li>
      </ol>
      <p>When you pick a shop tile, each spot shows its price and what it would add next turn. Tap a placed tile to see what it does and whether it's Lush. Daily savanna and New savanna start over from here.</p>
      <p>Every tile has a kind. When a rule says flora, grazer or predator, it means these tiles:</p>`;
    if (ECO.id === 'forest') return `
      <h2>Grow a forest through the year</h2>
      <ol>
        <li>The year runs from ${M(1)} to ${M(CONFIG.tides)}, one month a turn. Buy tiles with seeds and place them in the forest. Drop a tile on its twin to level it up: ★2 makes double, ★3 triple.</li>
        <li><b>Seasons.</b> Every tile makes ×2 in its season (its shop card shows the season emoji, and it glows on the board while in season). The Bumblebee is the exception: it's on in spring and summer, when touching understory plants make ×2, and off the rest of the year.</li>
        <li><b>Leaves.</b> In fall (September to November) each tree drops a leaf on every touching understory plant and empty spot. Every 2 leaves grow a plant a level for free, up to ★3. On an empty spot they wait: place a critter there for ${w(CONFIG.leafSeeds, 'shell')} a leaf, or a plant to grow it.</li>
        <li>Next month: every tile fires in order, 1 to 16, making seeds and amber.</li>
        <li>Amber is your score and your money. Spend it on Heirlooms (offered in ${CONFIG.charmTides.map(M).join(', ')}) and to clear fallen logs (or pay seeds instead), but hold enough to meet the goals in ${Object.keys(CONFIG.checkpoints).map(Number).map(M).join(' and ')}.</li>
        <li>In ${M(CONFIG.eventRevealTide)} you learn the forecast: a Derecho, Drought or Mast Year that comes after ${M(CONFIG.eventTide)}.</li>
        <li>Your score is the amber you hold after ${M(CONFIG.tides)}.</li>
      </ol>
      <p>When you pick a shop tile, each spot shows its price and what it would add next month. Tap a placed tile to see what it does and how close it is to growing. Daily forest and New forest start over from here.</p>
      <p>Every tile has a kind. When a rule says tree, understory or critter, it means these tiles:</p>`;
    return `
      <h2>Grow a reef that pays you back</h2>
      <ol>
        <li>Buy tiles with shells and place them on the reef. Drop a tile on its twin to level it up: ★2 makes double, ★3 triple, and a ★2 Sargassum counts as two flora for its neighbors. Most tiles stop at ★3, and each level-up costs ${CONFIG.levelUpStep} more than the last. Sargassum and Conch stack without limit: Sargassum always costs the same, Conch costs 1 more for every ${CONFIG.stackPriceEvery} you place.</li>
        <li>Let the tide in: every tile fires in order, 1 to 16, making shells and pearls.</li>
        <li>Pearls are your score and your money. Spend them to break rocks for more space and on Tide Charms (offered at tides ${CONFIG.charmTides.join(', ')}), but hold enough to meet the goals at tides ${Object.keys(CONFIG.checkpoints).join(' and ')}.</li>
        <li>At tide ${CONFIG.eventRevealTide} you learn the forecast: a Storm Surge, Hungry Shark or Undertow that hits after tide ${CONFIG.eventTide}. Build so your reef survives it.</li>
        <li>Your score is the pearls you hold after tide ${CONFIG.tides}.</li>
      </ol>
      <p>When you pick a shop tile, each spot shows its price and what it would add to your next tide. Spots you can't afford yet are dimmed. Tap a placed tile to see what it does, what feeds it and what it feeds. Daily reef and New reef start over from here.</p>
      <p>Every tile has a kind. When a rule says flora, shellfish or critter, it means these tiles:</p>
`;
  }

  function showHelp() {
    store.set('seenHelp', true);
    const dex = Object.entries(TILES).filter(([k]) => !CONFIG.disabled.includes(k)).map(([k, d]) => `<div><span class="e">${art(k)}</span><span><b>${d.name}</b> ${kindChip(d.tag)} ${fx(d.text(1))} ${d.stack ? `<i>Stacks without limit${d.flat ? ' at the same price' : `. Costs 1 more for every ${CONFIG.stackPriceEvery} you place`}.</i>` : ''}${d.afterFirstGoal ? ' <i>In the shop after the first goal.</i>' : ''}</span><span class="c">${amt(d.cost, 'shell')}</span></div>`).join('');
    const kinds = Object.keys(KINDS).map(tag => [tag, TP.kindNames(tag)]).filter(([, n]) => n).map(([tag, n]) => `<div>${kindChip(tag)}<span>${n}</span></div>`).join('');
    $('overlay').innerHTML = `<div class="sheet-bg" id="helpBg"><div class="sheet" role="dialog" aria-label="How to play">
      ${helpText()}
      <div class="kinds">${kinds}</div>
      <div class="dex">${dex}</div>
      <p class="build">Build __BUILD__</p>
      <div class="row"><button class="btn" id="helpDaily">Daily ${T.board}</button><button class="btn" id="helpNew">New ${T.board}</button></div>
      <div class="row"><button class="btn go" id="helpClose">${G && !G.over && (G.tide > 1 || G.grid.filter(Boolean).length > 1) ? 'Keep playing' : 'Play'}</button></div>
    </div></div>`;
    $('helpClose').addEventListener('click', closeOverlay);
    $('helpDaily').addEventListener('click', () => newRun(todaySeed(), true));
    $('helpNew').addEventListener('click', () => newRun(Math.floor(Math.random() * 1e9)));
    $('helpBg').addEventListener('click', (e) => { if (e.target.id === 'helpBg') closeOverlay(); });
  }

  // Boot: open on the ecosystem you played last, behind the picker (a hot reload keeps the run instead).
  function boot(data) {
    const id = (data && data.G && data.G.eco) || raw.get('tidepool.eco') || 'reef';
    useEco(TPX.forEco(id) ? id : 'reef');
    if (data && data.G) { start(data); return; }
    start(null, true);
    showPicker();
  }
  window.claude?.hot?.snapshot?.(() => ({ G }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
